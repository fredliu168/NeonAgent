<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Codex Bridge</title>
    <style>
      :root {
        --bg: #f6f9fc;
        --card: #ffffff;
        --line: #d8e1ea;
        --text: #11263c;
        --sub: #4f6176;
        --accent: #0f766e;
        --accent-2: #0e7490;
      }
      body {
        margin: 0;
        font: 13px/1.45 "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        width: 420px;
        padding: 14px;
        box-sizing: border-box;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      .desc {
        margin: 0 0 10px;
        color: var(--sub);
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      input, select, textarea, button {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }
      textarea {
        min-height: 72px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .inline label {
        margin: 0;
        font-weight: 500;
      }
      .inline input[type="checkbox"] {
        width: auto;
      }
      .hidden {
        display: none;
      }
      button {
        margin-top: 10px;
        border: none;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      pre {
        margin: 10px 0 0;
        max-height: 220px;
        overflow: auto;
        background: #0f172a;
        color: #dbeafe;
        border-radius: 8px;
        padding: 10px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .tip {
        margin-top: 8px;
        color: var(--sub);
      }
      .tip code {
        background: #eef2f7;
        border-radius: 4px;
        padding: 1px 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Codex Bridge</h1>
      <p class="desc">把消息转发给 NeonAgent 的外部接口（AGENT_EXTERNAL_*）。</p>
      <div class="card">
        <label for="neonId">NeonAgent Extension ID</label>
        <input id="neonId" placeholder="例如: abcdefghijklmnopqrstuvwxyzabcdef" />

        <div class="row">
          <div>
            <label for="mode">调用模式</label>
            <select id="mode">
              <option value="command">AGENT_EXTERNAL_COMMAND</option>
              <option value="tool">AGENT_EXTERNAL_TOOL_CALL</option>
            </select>
          </div>
          <div>
            <label for="tabId">Tab ID（可选）</label>
            <input id="tabId" placeholder="留空=当前活动标签页" />
          </div>
        </div>

        <div id="commandFields">
          <label for="userMessage">userMessage</label>
          <textarea id="userMessage" placeholder="例如：读取当前页面正文并总结"></textarea>
          <div class="row">
            <div class="inline">
              <input id="waitResult" type="checkbox" checked />
              <label for="waitResult">等待最终结果</label>
            </div>
            <div>
              <label for="waitTimeoutMs">等待超时(ms)</label>
              <input id="waitTimeoutMs" type="number" min="1000" step="1000" value="120000" />
            </div>
          </div>
          <label for="commandConfig">config JSON（可选）</label>
          <textarea id="commandConfig" placeholder='{"baseUrl":"...","apiKey":"...","model":"..."}'></textarea>
        </div>

        <div id="toolFields" class="hidden">
          <label for="toolName">toolName</label>
          <input id="toolName" placeholder="例如: read_page_content" />
          <label for="toolArgs">arguments JSON（可选）</label>
          <textarea id="toolArgs" placeholder='{"selector":"main","maxLength":1200}'></textarea>
          <label for="toolConfig">config JSON（可选）</label>
          <textarea id="toolConfig" placeholder='{"baseUrl":"...","apiKey":"...","model":"..."}'></textarea>
        </div>

        <button id="sendBtn" type="button">发送</button>
        <pre id="result">等待发送...</pre>
      </div>
      <div class="tip">
        提示：NeonAgent 侧如果要用 memory/skill/script_skill/task 类工具，需要先调用
        <code>load_tool_category</code>。
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
